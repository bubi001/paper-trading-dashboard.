name: Keep Streamlit Alive
on:
  schedule:
    - cron: '*/15 * * * *' # Triggers every 15 minutes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://paper-trading-dashboard-luqrtkrqla7vnpnw2evxzh.streamlit.app/" > /dev/null
